name: Flutter Setup

on:
  workflow_call:
    inputs:
      flutter-version:
        required: false
        type: string
        default: '3.24.4'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true
          
      - name: Install dependencies
        run: flutter pub get